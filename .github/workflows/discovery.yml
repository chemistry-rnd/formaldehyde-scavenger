name: discovery
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python src/discover.py --out artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: formulation-discovery
          path: artifacts/
